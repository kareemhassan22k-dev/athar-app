name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project files
      run: |
        unzip -o Athar-Android-Starter-1.zip || unzip -o *.zip
        # البحث عن المجلد الذي يحتوي على gradlew والدخول إليه
        GRADLE_DIR=$(find . -maxdepth 3 -name "gradlew" -exec dirname {} \;)
        echo "Found gradlew in: $GRADLE_DIR"
        if [ -n "$GRADLE_DIR" ]; then
          cd "$GRADLE_DIR"
        fi
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
        
